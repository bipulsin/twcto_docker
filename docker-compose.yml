# TradeWithCTO full stack: nginx + FastAPI app + PostgreSQL + Redis
#
# Quick start:
#   cp .env.example .env   # add API keys / secrets
#   docker compose pull    # or docker compose build
#   docker compose up -d
#   open http://localhost

name: twcto

services:
  postgres:
    image: ${TWCTO_POSTGRES_IMAGE:-ghcr.io/bipulsin/twcto-postgres:latest}
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trademanthan}
      POSTGRES_USER: ${POSTGRES_USER:-trademanthan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trademanthan123}
    volumes:
      - twcto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trademanthan} -d ${POSTGRES_DB:-trademanthan}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: ${TWCTO_APP_IMAGE:-ghcr.io/bipulsin/twcto-app:latest}
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        TRADEMANTHAN_REF: ${TRADEMANTHAN_REF:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trademanthan}:${POSTGRES_PASSWORD:-trademanthan123}@postgres:5432/${POSTGRES_DB:-trademanthan}
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-trademanthan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trademanthan123}
      POSTGRES_DB: ${POSTGRES_DB:-trademanthan}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - twcto_logs:/app/logs
      - twcto_inbox:/app/inbox
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s

  nginx:
    image: ${TWCTO_NGINX_IMAGE:-ghcr.io/bipulsin/twcto-nginx:latest}
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        TRADEMANTHAN_REF: ${TRADEMANTHAN_REF:-main}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  twcto_pgdata:
  twcto_logs:
  twcto_inbox:
