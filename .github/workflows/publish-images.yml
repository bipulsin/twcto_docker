name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      trademanthan_ref:
        description: trademanthan git ref to build
        required: false
        default: main
      seed_tag:
        description: GitHub release tag with DB + instruments assets
        required: false
        default: seed-2026-06-05

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bipulsin
  SEED_TAG: ${{ github.event.inputs.seed_tag || 'seed-2026-06-05' }}

jobs:
  prepare-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download production seed assets
        run: |
          mkdir -p db data/instruments
          curl -fL -o db/trademanthan.dump.gz \
            "https://github.com/bipulsin/twcto_docker/releases/download/${SEED_TAG}/trademanthan.dump.gz"
          curl -fL -o data/instruments/nse_instruments.json \
            "https://github.com/bipulsin/twcto_docker/releases/download/${SEED_TAG}/nse_instruments.json"
          ls -lh db/trademanthan.dump.gz data/instruments/nse_instruments.json

      - name: Upload seed build context
        uses: actions/upload-artifact@v4
        with:
          name: docker-seed-context
          path: |
            db/trademanthan.dump.gz
            data/instruments/nse_instruments.json
          retention-days: 2

  build-and-push:
    needs: prepare-seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: Dockerfile.app
            image: twcto-app
          - name: nginx
            file: Dockerfile.nginx
            image: twcto-nginx
          - name: postgres
            file: Dockerfile.postgres
            image: twcto-postgres

    steps:
      - uses: actions/checkout@v4

      - name: Download seed build context
        uses: actions/download-artifact@v4
        with:
          name: docker-seed-context

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRADEMANTHAN_REF=${{ github.event.inputs.trademanthan_ref || 'main' }}
