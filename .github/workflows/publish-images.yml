name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ['v*']
  repository_dispatch:
    types: [trademanthan-updated]
  workflow_dispatch:
    inputs:
      trademanthan_ref:
        description: trademanthan git ref to build
        required: false
        default: main
      seed_tag:
        description: GitHub release tag with DB + instruments assets
        required: false
        default: seed-2026-06-05

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bipulsin
  SEED_TAG: ${{ github.event.inputs.seed_tag || 'seed-2026-06-05' }}

jobs:
  # Always resolve branch/tag names to a commit SHA. Building with
  # TRADEMANTHAN_REF=main + GHA layer cache reuses a stale app-src clone and can
  # publish GHCR :latest missing files that exist on current main (root cause of
  # the 2026-07-16 kavach_10m.py outage after REBUILD=0 pull).
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref_in: ${{ steps.resolve.outputs.ref_in }}
    steps:
      - name: Resolve trademanthan ref → full SHA
        id: resolve
        run: |
          set -euo pipefail
          REF_IN='${{ github.event.client_payload.ref || github.event.inputs.trademanthan_ref || 'main' }}'
          REF_IN="${REF_IN:-main}"
          echo "ref_in=${REF_IN}" >> "$GITHUB_OUTPUT"
          if [[ "$REF_IN" =~ ^[0-9a-fA-F]{40}$ ]]; then
            SHA="$REF_IN"
          else
            SHA="$(git ls-remote "https://github.com/bipulsin/trademanthan.git" "refs/heads/${REF_IN}" "refs/tags/${REF_IN}" "refs/tags/${REF_IN}^{}" | awk 'NF{print $1; exit}')"
            if [[ -z "$SHA" ]]; then
              # bare SHA prefix / other ref
              SHA="$(git ls-remote "https://github.com/bipulsin/trademanthan.git" "$REF_IN" | awk 'NF{print $1; exit}')"
            fi
          fi
          if [[ -z "$SHA" || ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve trademanthan ref '${REF_IN}' to a 40-char SHA"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved trademanthan ${REF_IN} → ${SHA}"

  prepare-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download production seed assets
        run: |
          mkdir -p db data/instruments
          curl -fL -o db/trademanthan.dump.gz \
            "https://github.com/bipulsin/twcto_docker/releases/download/${SEED_TAG}/trademanthan.dump.gz"
          curl -fL -o data/instruments/nse_instruments.json \
            "https://github.com/bipulsin/twcto_docker/releases/download/${SEED_TAG}/nse_instruments.json"
          ls -lh db/trademanthan.dump.gz data/instruments/nse_instruments.json

      - name: Upload seed build context
        uses: actions/upload-artifact@v4
        with:
          name: docker-seed-context
          path: |
            db/trademanthan.dump.gz
            data/instruments/nse_instruments.json
          retention-days: 2

  build-and-push:
    needs: [resolve-ref, prepare-seed]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: Dockerfile.app
            image: twcto-app
          - name: nginx
            file: Dockerfile.nginx
            image: twcto-nginx
          - name: postgres
            file: Dockerfile.postgres
            image: twcto-postgres

    steps:
      - uses: actions/checkout@v4

      - name: Download seed build context
        uses: actions/download-artifact@v4
        with:
          name: docker-seed-context

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-ref.outputs.sha }}
            twcto.trademanthan.sha=${{ needs.resolve-ref.outputs.sha }}

      - name: Build and push ${{ matrix.name }} (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            TRADEMANTHAN_REF=${{ needs.resolve-ref.outputs.sha }}
            APP_SRC_REV=${{ needs.resolve-ref.outputs.sha }}
            FRONTEND_SRC_REV=${{ needs.resolve-ref.outputs.sha }}

      # Catch incomplete images before paperclip ever pulls them.
      - name: Post-push sanity check (app, linux/amd64)
        if: matrix.name == 'app'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/twcto-app:latest
        run: |
          set -euo pipefail
          # On non-default branches latest may not exist; prefer the first pushed tag.
          TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          IMAGE="${TAG:-$IMAGE}"
          chmod +x scripts/sanity-check-app-image.sh
          docker pull --platform linux/amd64 "$IMAGE"
          IMAGE="$IMAGE" ./scripts/sanity-check-app-image.sh "$IMAGE"

      - name: Post-push sanity check (nginx frontend files)
        if: matrix.name == 'nginx'
        run: |
          set -euo pipefail
          TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker pull --platform linux/amd64 "$TAG"
          docker run --rm --entrypoint sh "$TAG" -c \
            'test -f /usr/share/nginx/html/index.html && test -f /usr/share/nginx/html/dailyRSchecklist.html && echo nginx-src sanity OK'
